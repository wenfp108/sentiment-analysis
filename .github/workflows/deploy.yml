  name: 🚀 Deploy to Serv00                                 

  on:
    push:
      branches: [main]
    workflow_dispatch:

  jobs:
    deploy:
      runs-on: ubuntu-latest
      timeout-minutes: 5

      steps:
        - name: 📥 Checkout
          uses: actions/checkout@v4

        - name: 📤 Deploy via FTP
          uses: SamKirkland/FTP-Deploy-Action@v4.3.5
          with:
            server: ${{ secrets.SERV00_FTP_HOST }}
            username: ${{ secrets.SERV00_FTP_USER }}
            password: ${{ secrets.SERV00_FTP_PASS }}
            local-dir: ./
            server-dir: /sentiment-analysis/
            exclude: |
              .git/**
              .github/**
              screenshots/**
              assets/**
              docker-compose.yml
              Dockerfile
              **/Dockerfile
              streamlit-app/**
              reddit-producer/**
              reddit-consumer/**
              model-server/**
              api/**
              .pre-commit-config.yaml
